name: Compila Plico

# Si avvia a mano dalla scheda "Actions" di GitHub (i file restano scaricabili da lì per qualche giorno),
# oppure creando un tag che inizia con "v" (es. v1.0.0): in quel caso i file vengono anche
# pubblicati nella pagina "Releases", con nomi fissi usati dal sito di download.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target.noindex"

      - run: npm ci

      # Windows: installer .exe
      - name: Compila (Windows)
        if: matrix.os == 'windows-latest'
        run: npx tauri build --bundles nsis

      # Mac: .dmg "universale", funziona sia sui Mac con chip Apple sia su quelli Intel
      - name: Compila (macOS)
        if: matrix.os == 'macos-latest'
        run: npx tauri build --target universal-apple-darwin --bundles dmg

      # Nomi fissi, così il sito può puntare sempre a .../releases/latest/download/<nome>
      - name: Rinomina i file (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir out
          cp src-tauri/target.noindex/release/bundle/nsis/*.exe out/Plico-windows-setup.exe

      - name: Rinomina i file (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir out
          cp src-tauri/target.noindex/universal-apple-darwin/release/bundle/dmg/*.dmg out/Plico-mac.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Plico-${{ matrix.label }}
          path: out/*

  # Solo con un tag "v…": pubblica i file nella pagina Releases
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/* \
            --repo "${{ github.repository }}" \
            --title "Plico ${{ github.ref_name }}" \
            --generate-notes
